# CD: ships main to production in a fixed order, each stage only if the one before it passed.
#
#   1. CI              the same checks as every pull request (ci.yml)
#   2. Database        applies any new migrations to the real Supabase project
#   3. Site            publishes the pages to GitHub Pages
#
# The database goes first so new pages never go live before the tables they need exist.
#
# One-off setup (see README "Deploy pipeline"):
#   - Settings -> Pages -> Source: "GitHub Actions"
#   - Settings -> Secrets and variables -> Actions: SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD
#   - Supabase -> Project Settings -> Integrations -> GitHub: turn off "Deploy to production",
#     so this workflow is the only thing applying migrations.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits for the current one instead of cancelling it halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  database:
    name: Apply migrations to Supabase
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: rxcgwuduvnfycrjhvgbu # also visible in shared.js; not a secret
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check the secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository secrets (see README, Deploy pipeline)."
            exit 1
          fi

      - name: Link the Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show which migrations production already has
        run: supabase migration list --linked

      - name: Show what this deploy will apply
        run: supabase db push --linked --dry-run

      - name: Apply new migrations
        run: supabase db push --linked --yes

  site:
    name: Publish to GitHub Pages
    needs: database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the site files
        # Only what the browser needs: not tests/, supabase/ or the README.
        run: |
          mkdir _site
          cp ./*.html ./*.css ./*.js _site/
          if [ -f best-host.jpg ]; then cp best-host.jpg _site/; fi
          ls -la _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
